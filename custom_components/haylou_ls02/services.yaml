send_message:
  name: Send Message
  description: Send a message to the Haylou watch display
  fields:
    device_address:
      name: Device address
      description: MAC address of the watch (required when multiple watches are configured)
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    message:
      name: Message
      description: The message text to send
      required: true
      selector:
        text:
          multiline: false
    message_type:
      name: Message Type
      description: Type of alert message
      required: false
      default: generic
      selector:
        select:
          options:
            - "phone_call"
            - "qq"
            - "wechat"
            - "generic"
            - "facebook"
            - "twitter"
            - "whatsapp"
            - "skype"
            - "messenger"
            - "hangouts"
            - "line"
            - "linkedin"
            - "instagram"
            - "viber"
            - "kakaotalk"
            - "vk"
            - "snapchat"
            - "googleplus"
            - "email"
            - "flickr"
            - "tumblr"
            - "pinterest"
            - "youtube"

